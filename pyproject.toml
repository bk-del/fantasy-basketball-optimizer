[build-system]
requires = ["scikit-build-core==0.11.6", "nanobind==2.9.2"]
build-backend = "scikit_build_core.build"

[project]
name = "fantasy-basketball-optimizer"
version = "0.0.1"
description = "Planned personal, read-only Yahoo fantasy basketball decision tool"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.4.5",
    "nanobind==2.9.2",
    "numpy==2.2.6",
]

[project.optional-dependencies]
advanced = ["lightgbm==4.6.0", "scipy==1.15.3", "torch==2.6.0+cpu"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
fantasy = "fantasy_optimizer.cli:main"

[dependency-groups]
dev = ["mypy==1.16.1", "pytest==8.4.1", "ruff==0.11.13"]

[tool.scikit-build]
wheel.packages = ["src/fantasy_optimizer"]
cmake.source-dir = "cpp"
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
BUILD_TESTING = "OFF"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --disable-plugin-autoload"
