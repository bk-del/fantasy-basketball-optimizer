name: Local checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.18'
      - name: Install Ubuntu C++ tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends g++ cmake ninja-build clang-format-14 clang-tidy-14 catch2
      - name: Install pinned Python and locked development dependencies
        run: uv sync --locked --group dev
      - name: Offline Python checks
        run: |
          uv run --offline --no-sync ruff check .
          uv run --offline --no-sync ruff format --check .
          uv run --offline --no-sync mypy src
          uv run --offline --no-sync pytest -q
          uv run --offline --no-sync fantasy simulate --fixture > /tmp/matchup.json
          uv run --offline --no-sync fantasy optimize --fixture > /tmp/optimization.json
          uv run --offline --no-sync fantasy context --fixture > /tmp/context.json
          uv run --offline --no-sync fantasy train --fixture --registry /tmp/models.json > /tmp/training.json
          uv run --offline --no-sync fantasy backtest --fixture --registry /tmp/models.json > /tmp/backtest.json
          uv run --offline --no-sync fantasy model status --fixture --registry /tmp/models.json
          uv run --offline --no-sync fantasy run --fixture --registry /tmp/models.json > /tmp/run.json
          uv run --offline --no-sync fantasy --help
          uv run --offline --no-sync fantasy status
          uv run --offline --no-sync fantasy auth status
          uv run --offline --no-sync fantasy audit --fixture > /tmp/yahoo-fixture-audit.json
          uv run --offline --no-sync fantasy sync --fixture --database /tmp/yahoo-fixture.duckdb
          uv run --offline --no-sync fantasy sync --fixture --database /tmp/yahoo-fixture.duckdb
          uv run --offline --no-sync fantasy sync --fixture --scenario changed --database /tmp/yahoo-fixture.duckdb
          uv run --offline --no-sync fantasy forecast --fixture --benchmark --output /tmp/forecast-artifacts > /tmp/weekly-forecast.json
      - name: Format tracked C++ sources
        run: git ls-files -z -- '*.cpp' '*.hpp' | xargs -0 -r clang-format-14 --dry-run --Werror
      - name: Build with clang-tidy and Debug sanitizers
        run: |
          cmake -S cpp -B build/cpp -G Ninja -DCMAKE_BUILD_TYPE=Debug -DPython_EXECUTABLE="$PWD/.venv/bin/python"
          cmake --build build/cpp
          ctest --test-dir build/cpp --output-on-failure
